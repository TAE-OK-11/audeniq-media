name: Native versus reference media codecs
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tools/**
      - tests/**
      - .github/workflows/media-codecs.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchain and development oracle
        run: |
          rustc --version
          cargo --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg time
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --workspace --features reference-codecs --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --features reference-codecs --locked --target-dir reference-target
      - run: cargo build --workspace --release --locked
      - run: cargo build --release --features reference-codecs --locked --target-dir reference-target
      - name: Identify both builds
        run: |
          target/release/audeniq-qc capabilities
          reference-target/release/audeniq-qc capabilities
          cargo tree --locked -e normal
      - name: Native and reference qualification
        run: |
          target/release/audeniq-qc-tools qualify --output qualification-native.json
          target/release/audeniq-qc-tools codec-stress --output stress-native.json
          target/release/audeniq-qc-tools standards --output standards-native.json
          target/release/audeniq-qc-tools qualify --binary reference-target/release/audeniq-qc --output qualification-reference.json
          target/release/audeniq-qc-tools codec-stress --binary reference-target/release/audeniq-qc --output stress-reference.json
      - name: Same-host three-way repeated comparisons
        run: |
          target/release/audeniq-qc-tools benchmark-decode --seconds 240 --repeats 7 --reference-binary reference-target/release/audeniq-qc --output decoding-benchmark.json
          target/release/audeniq-qc-tools benchmark-convert --wav-alac-only --seconds 240 --repeats 7 --reference-binary reference-target/release/audeniq-qc --output normalization-benchmark.json
          target/release/audeniq-qc-tools benchmark --wav-alac-only --seconds 240 --repeats 7 --reference-binary reference-target/release/audeniq-qc --output analysis-benchmark.json
          target/release/audeniq-qc-tools benchmark-convert --seconds 60 --repeats 5 --reference-binary reference-target/release/audeniq-qc --output conversion-all-benchmark.json
          target/release/audeniq-qc-tools benchmark-review --seconds 120 --repeats 5 --reference-binary reference-target/release/audeniq-qc --output review-benchmark.json
          target/release/audeniq-qc-tools benchmark-review --seconds 120 --repeats 5 --reference-binary reference-target/release/audeniq-qc --fingerprint --output review-fingerprint-benchmark.json
          target/release/audeniq-qc-tools ci-report
