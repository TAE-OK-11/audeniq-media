name: Native Rust qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchain and development oracle
        run: |
          rustc --version
          cargo --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg time
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release
      - run: target/release/audeniq-qc capabilities
      - run: target/release/audeniq-qc-tools qualify --output qualification.json
      - run: target/release/audeniq-qc-tools standards --output standards.json
      - run: target/release/audeniq-qc-tools codec-stress --output codec-stress.json
      - name: Measure analysis and verified normalization
        run: |
          target/release/audeniq-qc-tools benchmark --seconds 120 --repeats 3 --output analysis-benchmark.json
          target/release/audeniq-qc-tools benchmark --seconds 120 --repeats 3 --fingerprint --output fingerprint-benchmark.json
          target/release/audeniq-qc-tools benchmark-convert --seconds 60 --repeats 3 --output normalization-benchmark.json
          target/release/audeniq-qc-tools ci-report
