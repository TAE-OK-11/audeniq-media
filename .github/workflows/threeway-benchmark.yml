name: Three-way native / reference / FFmpeg benchmark
on:
  push:
    branches: [perf/ffmpeg-replacement-native]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tools/**
      - .github/workflows/threeway-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Engine before this optimization series (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4fc2bb9b8d4081dc7d6569e216e3be58dff15692
          path: main-engine
      - name: Toolchain and development oracle
        run: |
          rustc --version
          cargo --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg time
          grep -m4 -E "model name|CPU implementer|CPU part" /proc/cpuinfo || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --workspace --features reference-codecs --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --features reference-codecs --locked --target-dir reference-target
      - run: cargo build --workspace --release --locked
      - run: cargo build --release --features reference-codecs --locked --target-dir reference-target
      - run: cargo build --manifest-path main-engine/Cargo.toml --release --locked --target-dir main-target
      - name: Identify builds
        run: |
          target/release/audeniq-qc capabilities
          reference-target/release/audeniq-qc capabilities
          main-target/release/audeniq-qc capabilities
      - name: Qualification and codec stress (native and reference)
        run: |
          target/release/audeniq-qc-tools qualify --output qualification-native.json
          target/release/audeniq-qc-tools codec-stress --output stress-native.json
          target/release/audeniq-qc-tools standards --output standards-native.json
          target/release/audeniq-qc-tools qualify --binary reference-target/release/audeniq-qc --output qualification-reference.json
          target/release/audeniq-qc-tools codec-stress --binary reference-target/release/audeniq-qc --output stress-reference.json
          for f in qualification-native stress-native standards-native qualification-reference stress-reference; do
            python3 -c "import json,sys; d=json.load(open('$f.json')); print('$f', d.get('status'), d.get('checks'))"
          done
      - name: Tone and music fixtures, native versus Symphonia reference and FFmpeg
        run: |
          T=target/release/audeniq-qc-tools
          for signal in tone music; do
            export AUDENIQ_BENCH_SIGNAL=$signal
            $T benchmark-decode --seconds 240 --repeats 7 --reference-binary reference-target/release/audeniq-qc --output $signal-decode-reference.json
            $T benchmark-convert --wav-alac-only --seconds 240 --repeats 7 --reference-binary reference-target/release/audeniq-qc --output $signal-convert-reference.json
            $T benchmark --wav-alac-only --seconds 240 --repeats 7 --reference-binary reference-target/release/audeniq-qc --output $signal-analysis-reference.json
            $T benchmark-review --seconds 120 --repeats 5 --reference-binary reference-target/release/audeniq-qc --output $signal-review-reference.json
            $T benchmark-convert --seconds 60 --repeats 5 --reference-binary reference-target/release/audeniq-qc --output $signal-convert-all-reference.json
            python3 tools/scripts/threeway_summary.py $signal $signal-decode-reference.json $signal-convert-reference.json $signal-analysis-reference.json $signal-review-reference.json $signal-convert-all-reference.json
          done
      - name: Same-host comparison with the main engine
        run: |
          T=target/release/audeniq-qc-tools
          for signal in tone music; do
            export AUDENIQ_BENCH_SIGNAL=$signal
            $T benchmark-decode --seconds 240 --repeats 7 --comparison-binary main-target/release/audeniq-qc --output $signal-decode-main.json
            $T benchmark-convert --wav-alac-only --seconds 240 --repeats 7 --comparison-binary main-target/release/audeniq-qc --output $signal-convert-main.json
            $T benchmark-review --seconds 120 --repeats 5 --comparison-binary main-target/release/audeniq-qc --output $signal-review-main.json
            python3 tools/scripts/threeway_summary.py $signal $signal-decode-main.json $signal-convert-main.json $signal-review-main.json
          done
