[package]
name = "audeniq-qc"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "LGPL-2.1-or-later"
description = "Bounded, lossless-only audio normalization and QC for AUDENIQ"
repository = "https://github.com/TAE-OK-11/audeniq-qc"

[workspace]
members = ["tools"]
default-members = ["."]
resolver = "2"

[dependencies]
symphonia = { version = "=0.5.4", optional = true, default-features = false, features = ["flac", "alac", "isomp4"] }

[dev-dependencies]
# Independent oracles for the native MD5, SHA-256, CRC-32, cover and JSON tests only.
md5_reference = { package = "md-5", version = "=0.10.6" }
sha2_reference = { package = "sha2", version = "=0.11.0" }
crc32fast_reference = { package = "crc32fast", version = "=1.5.2" }
image_reference = { package = "image", version = "=0.24.9", default-features = false, features = ["jpeg", "png"] }
serde_json_reference = { package = "serde_json", version = "=1.0.140" }

[features]
default = []
reference-codecs = ["dep:symphonia"]
profile-native = []

[profile.release]
opt-level = 3
panic = "abort"
# CPU acceleration is implemented in runtime-dispatched kernels, not LTO.
