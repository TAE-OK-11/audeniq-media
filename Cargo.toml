[package]
name = "audeniq-qc"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "LGPL-2.1-or-later"
description = "Bounded, lossless-only audio normalization and QC for AUDENIQ"
repository = "https://github.com/TAE-OK-11/audeniq-qc"

[workspace]
members = ["tools"]
default-members = ["."]
resolver = "2"

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.11.0"
md-5 = "=0.10.6"
crc32fast = "=1.5.2"
symphonia = { version = "=0.5.4", default-features = false, features = ["flac", "alac", "isomp4"] }
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
panic = "abort"
# CPU acceleration is implemented in runtime-dispatched kernels, not LTO.
