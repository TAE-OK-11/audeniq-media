[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
repository = "https://github.com/TAE-OK-11/audeniq-qc"

[workspace.dependencies]
media-hash = { path = "crates/media-hash", default-features = false }
media-json = { path = "crates/media-json" }
photo-core = { path = "crates/photo-core" }
photo-deflate = { path = "crates/photo-deflate" }
photo-png = { path = "crates/photo-png" }
photo-jpeg = { path = "crates/photo-jpeg" }
photo-icc = { path = "crates/photo-icc" }
photo-meta = { path = "crates/photo-meta" }
photo-qr = { path = "crates/photo-qr" }
photo-ocr = { path = "crates/photo-ocr" }
audeniq-photo = { path = "crates/audeniq-photo" }
photo-pdf = { path = "crates/photo-pdf" }
photo-pdf-syntax = { path = "crates/photo-pdf-syntax" }
photo-pdf-interpret = { path = "crates/photo-pdf-interpret" }
photo-pdf-ccitt = { path = "crates/photo-pdf-ccitt" }
photo-pdf-jbig2 = { path = "crates/photo-pdf-jbig2" }
photo-pdf-jpeg2000 = { path = "crates/photo-pdf-jpeg2000" }
photo-pdf-cmap = { path = "crates/photo-pdf-cmap" }
photo-pdf-postscript = { path = "crates/photo-pdf-postscript" }

# Third-party crates the PDF renderer (from hayro) still uses; candidates
# for later merging (see docs/PORTING.md).
# Global allocator of the binaries (libraries never pick one).
mimalloc = { version = "0.1.52", default-features = false }
bytemuck = "1"
fearless_simd = "1.0.0"
kurbo = "0.13.0"
log = "0.4"
moxcms = "0.8.1"
pic-scale = { version = "0.7.9", default-features = false }
skrifa = "0.46.0"
smallvec = "1"
vello_cpu = { version = "0.3", default-features = false, features = ["std", "u8_pipeline"] }
yoke = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Codec loops index several parallel arrays by the same position; iterator
# rewrites are less readable there. `as_chunks` needs Rust 1.88+ APIs we
# keep optional for now.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# Rasterizer and decoder kernels (from hayro) pass many scalars.
too_many_arguments = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2

# `release` is the audio engine's measured profile: runtime-dispatched SIMD
# kernels, no LTO (fat LTO or one codegen unit made ALAC conversion ~13%
# slower) and abort on panic (no unwind runtime to resolve at start-up).
[profile.release]
opt-level = 3
panic = "abort"

# audeniq-photo binaries: cross-crate inlining matters there (OCR is ~11%
# slower without LTO), and decoder panics are isolated with catch_unwind, so
# audeniq-photo refuses to build without unwinding. Build with
# `--profile release-photo`.
[profile.release-photo]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.profiling]
inherits = "release-photo"
debug = true
strip = false

# The LSTM forward pass is unusably slow unoptimized; keep tests fast.
[profile.dev.package.photo-ocr]
opt-level = 3
