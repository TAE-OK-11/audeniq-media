[package]
name = "media-hash"
description = "Streaming MD5, SHA-256 and CRC-32 with runtime-dispatched hardware kernels, shared by the AUDENIQ media engines"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = []

[dev-dependencies]
# Independent oracles for the tests only.
md5_reference = { package = "md-5", version = "=0.10.6" }
sha2_reference = { package = "sha2", version = "=0.11.0" }
crc32fast_reference = { package = "crc32fast", version = "=1.5.2" }

[lints.clippy]
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
