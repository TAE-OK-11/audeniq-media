[package]
name = "media-json"
description = "Dependency-free JSON values, writers and parser with serde_json-identical output, shared by the AUDENIQ media engines"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
# Independent oracle for the tests only.
serde_json_reference = { package = "serde_json", version = "=1.0.140" }

# One `String::from_utf8_unchecked` (lib.rs `utf8`) needs unsafe.
[lints.rust]
unsafe_code = "deny"
