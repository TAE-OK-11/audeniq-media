[package]
name = "photo-hash"
description = "Streaming MD5, SHA-256 and CRC32 reused from audeniq-qc"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "LGPL-2.1-or-later"

[features]
default = ["std"]
std = []

[dev-dependencies]
md5_reference = { package = "md-5", version = "0.10.6" }
sha2_reference = { package = "sha2", version = "0.10" }
crc32fast_reference = { package = "crc32fast", version = "1.5" }

[lints.clippy]
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
