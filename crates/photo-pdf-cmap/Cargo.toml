[package]
name = "photo-pdf-cmap"
description = "PDF CMap parser with embedded predefined CMaps (from hayro-cmap)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[features]
default = ["embed-cmaps"]
std = []
embed-cmaps = ["std", "dep:photo-deflate"]

[dependencies]
photo-pdf-postscript.workspace = true
photo-deflate = { workspace = true, optional = true }

[dev-dependencies]
media-hash = { workspace = true, features = ["std"] }

[lints]
workspace = true
