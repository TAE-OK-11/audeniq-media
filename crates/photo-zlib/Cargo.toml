[package]
name = "photo-zlib"
description = "Vendored zlib-rs (memory-safe zlib-ng port) tuned for audeniq-photo"
version = "0.6.8"
edition = "2021"
rust-version = "1.88"
license = "Zlib"
repository = "https://github.com/TAE-OK-11/audeniq-photo"
readme = "README.md"

# Upstream: https://github.com/trifectatechfoundation/zlib-rs @ 7909c0fc48f5d29f6610770e31d6f0c924f9ec3b (zlib-rs 0.6.8).
# The only crate in the workspace allowed to use `unsafe` (SIMD kernels and
# the zlib stream state); see UPSTREAM.md.
[lib]
# Keep upstream's crate name so sources and doctests stay unmodified.
name = "zlib_rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Items only used by the C allocator / C API builds, which are off here.
dead_code = "allow"
unused_imports = "allow"

[lints.clippy]
# Vendored source is kept byte-identical to upstream; style lints there are
# upstream's call.
all = { level = "allow", priority = -1 }

[features]
# audeniq: pure Rust allocation by default (upstream also enables a libc
# malloc allocator for C callers, which this workspace never is).
default = ["std"]
std = ["rust-allocator"]
c-allocator = []
rust-allocator = []
__internal-fuzz = ["arbitrary"]
__internal-fuzz-disable-checksum = []
__internal-test = ["quickcheck"]
__internal-api = []
ZLIB_DEBUG = []
vpclmulqdq = []
avx512 = ["vpclmulqdq"]
lsx = []

[dependencies]
arbitrary = { version = "1.0", optional = true, features = ["derive"] }
quickcheck = { version = "1.0.3", default-features = false, optional = true }

[dev-dependencies]
crc32fast = "1.3.2"
memoffset = "0.9.1"
quickcheck = { version = "1.0.3", default-features = false }
